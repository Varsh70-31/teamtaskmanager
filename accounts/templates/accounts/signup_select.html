{% extends 'base.html' %}

{% block content %}
<div class="form-card">
    <h2>Choose account type</h2>
    <p>Select the signup path for the account you need.</p>
    <div class="button-group">
        <a class="button button-primary" href="/accounts/signup/admin/">Admin Signup</a>
        <a class="button button-secondary" href="/accounts/signup/tasker/">Tasker Signup</a>
    </div>
    <p class="mt-3">Choose the account type you want to create. Admins and Taskers can be created directly.</p>
    <p class="mt-3">Already have an account? <a href="/accounts/login/">Log in</a></p>
</div>
{% endblock %}
